name: scutum-mesh
runtime: yaml
description: Manage a Scutum WireGuard mesh with Pulumi

# Pulumi uses the Terraform provider via the terraform-bridge.
# Install with: pulumi plugin install resource scutum v1.0.0 --server github://api.github.com/Sovforge/pulumi-scutum

config:
  scutum:endpoint:
    value: https://scutum.example.com
  scutum:apiKey:
    secret: true

resources:

  edge-eu-west:
    type: scutum:index:Node
    properties:
      name: edge-eu-west-1
      type: remote
      address: 10.100.0.10/32
      publicKey: Jk5Hf3zXqTvP2LmN9sKdWbYcEuRoAiQeGhVwMnBxOp0=

  edge-us-east:
    type: scutum:index:Node
    properties:
      name: edge-us-east-1
      type: remote
      address: 10.100.0.11/32
      publicKey: Rp7Ld2yZwUqA4MnJ8vNcGbXhEiToSfKrOeVmBuCxPj1=

  production-group:
    type: scutum:index:Group
    properties:
      name: production
      description: All production edge nodes
      nodeIds:
        - ${edge-eu-west.id}
        - ${edge-us-east.id}

  pagerduty-webhook:
    type: scutum:index:Webhook
    properties:
      name: PagerDuty alerts
      url: https://events.pagerduty.com/integration/abc123/enqueue
      events:
        - alert.fired
        - alert.resolved
        - node.offline
      enabled: true

  dr-federation:
    type: scutum:index:FederationPeer
    properties:
      name: dr-site
      hubUrl: https://scutum-dr.example.com
      wgEndpoint: 203.0.113.50:51820
      wgPublicKey: DrHubPubKey+AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      meshCidr: 10.200.0.0/24

outputs:
  productionGroupId: ${production-group.id}
  euWestNodeId: ${edge-eu-west.id}