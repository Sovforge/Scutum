name: Cut release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    name: Tag and release
    # Only a merged develop→main PR cuts a release — an unmerged (closed
    # without merging) PR, or a PR from any other branch into main, does
    # nothing.
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the release branch + tag
      pull-requests: write   # open and merge the release PR

    steps:
      # The PR merge already landed develop's commits on main — this picks
      # up main post-merge rather than merging again here.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Decide the bump type from Conventional Commits ──────────────────────
      # Scans every commit since the last tag: any BREAKING CHANGE footer or
      # "type!:" subject → major, any "feat:" → minor, otherwise patch. No
      # third-party action — this repo's commit history already follows the
      # convention closely enough to trust it.
      #
      # A squash merge (this ruleset only allows squash merges to main) puts
      # every original commit's subject+body into the squash commit's body as
      # a "* <subject>\n\n<body>" bullet list, not as separate commits — so
      # the conventional-commit prefix no longer sits at the true start of
      # the line. The `^[-*]?\s*` prefix below accounts for that bullet.
      - name: Determine version bump
        id: bump
        run: |
          LAST=$(git tag --list 'v*.*.*' --sort=-version:refname | head -1)
          LAST=${LAST:-v0.0.0}

          # First release (no prior tag exists as a real ref yet): scan all
          # history instead of a LAST..HEAD range, which would fail to resolve.
          RANGE="$LAST..HEAD"
          git rev-parse "$LAST" >/dev/null 2>&1 || RANGE="HEAD"

          LOG=$(git log "$RANGE" --pretty=format:'%s%n%b')

          if echo "$LOG" | grep -qE '(^|[^a-zA-Z])BREAKING CHANGE|^[-*]?\s*[a-z]+(\([^)]*\))?!:'; then
            BUMP=major
          elif echo "$LOG" | grep -qE '^[-*]?\s*feat(\([^)]*\))?:'; then
            BUMP=minor
          else
            BUMP=patch
          fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Detected bump: $BUMP (since $LAST)"

      # ── Compute next version ────────────────────────────────────────────────
      - name: Compute next version
        id: ver
        run: |
          LAST=$(git tag --list 'v*.*.*' --sort=-version:refname | head -1)
          LAST=${LAST:-v0.0.0}

          MAJOR=$(echo "$LAST" | sed 's/^v//' | cut -d. -f1)
          MINOR=$(echo "$LAST" | sed 's/^v//' | cut -d. -f2)
          PATCH=$(echo "$LAST" | sed 's/^v//' | cut -d. -f3)

          case "${{ steps.bump.outputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$VERSION"        >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"           >> "$GITHUB_OUTPUT"
          echo "Bumping $LAST → v$VERSION (${{ steps.bump.outputs.bump }})"

      # ── Stamp CHANGELOG ─────────────────────────────────────────────────────
      # Handles two heading formats that may appear in the file:
      #   ## [Unreleased]
      #   ## [X.Y.Z] — Unreleased
      - name: Stamp CHANGELOG
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          DATE=$(date -u +"%Y-%m-%d")

          # Replace the unreleased heading with the new versioned + dated heading.
          sed -i \
            -e "s|^## \[Unreleased\]|## [$VERSION] — $DATE|" \
            -e "s|^## \[[0-9]*\.[0-9]*\.[0-9]*\] — Unreleased|## [$VERSION] — $DATE|" \
            CHANGELOG.md

          # Prepend a fresh [Unreleased] section above the newly versioned block
          # so contributors can start adding entries immediately.
          sed -i "0,/^## \[$VERSION\]/s|^## \[$VERSION\]|## [Unreleased]\n\n---\n\n## [$VERSION]|" \
            CHANGELOG.md

      # ── Update Helm chart ────────────────────────────────────────────────────
      - name: Update Helm chart version
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          sed -i "s|^version:.*|version: $VERSION|"         helm/scutum/Chart.yaml
          sed -i "s|^appVersion:.*|appVersion: \"$VERSION\"|" helm/scutum/Chart.yaml

      # ── Open and merge a release PR, then tag ───────────────────────────────
      # main requires every change — even this bot's — to land via a
      # (squash-only) pull request, so this pushes the stamp to a throwaway
      # branch and merges it through the API rather than pushing to main
      # directly.
      - name: Open and merge release PR
        id: release_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="release/${{ steps.ver.outputs.tag }}"
          git checkout -b "$BRANCH"
          git add CHANGELOG.md helm/scutum/Chart.yaml
          git commit -m "chore: release ${{ steps.ver.outputs.tag }}"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "chore: release ${{ steps.ver.outputs.tag }}" \
            --body "Automated version bump (${{ steps.bump.outputs.bump }}) — CHANGELOG stamp and Helm chart version for ${{ steps.ver.outputs.tag }}.")

          gh pr merge "$PR_URL" --squash --delete-branch

          # The squash merge creates a brand-new commit on main — tag that,
          # not the throwaway release-branch commit made above.
          git fetch origin main
          git tag "${{ steps.ver.outputs.tag }}" origin/main
          git push origin "${{ steps.ver.outputs.tag }}"

      # ── Carry the same stamp back onto develop ──────────────────────────────
      # Otherwise develop's CHANGELOG/Helm version silently fall behind main's
      # after every release, and the next release wouldn't have a fresh
      # "## [Unreleased]" heading for contributors to add entries under.
      - name: Sync CHANGELOG/Helm stamp back to develop
        run: |
          git fetch origin develop main
          git checkout -B develop origin/develop
          # origin/main, not the local main branch — the latter is stale
          # since the release PR above was merged remotely via the API, not
          # pushed to this checkout's local main ref.
          git checkout origin/main -- CHANGELOG.md helm/scutum/Chart.yaml

          if git diff --cached --quiet; then
            echo "develop already up to date, nothing to sync"
          else
            git add CHANGELOG.md helm/scutum/Chart.yaml
            git commit -m "chore: sync CHANGELOG/Helm version after ${{ steps.ver.outputs.tag }} release"
            git push origin HEAD:develop
          fi

      - name: Summary
        run: |
          {
            echo "### Released ${{ steps.ver.outputs.tag }}"
            echo ""
            echo "- Bump type: ${{ steps.bump.outputs.bump }} (auto-detected from commits since the last tag)"
            echo "- \`develop\` → \`main\` merge was the PR you just merged"
            echo "- Tag \`${{ steps.ver.outputs.tag }}\` pushed → **Release** workflow building now"
            echo "- CHANGELOG/Helm version synced back to \`develop\`"
          } >> "$GITHUB_STEP_SUMMARY"
